[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geordie"
version = "0.2.0"
description = "Geographical Entity Object Recognition, Detection, Identification and Extraction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SIRIS Academic", email = "info@sirisacademic.com" },
]
keywords = [
    "NER",
    "geography",
    "geocoding",
    "entity-linking",
    "NLP",
    "bibliometrics",
    "semantic-role-labelling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "transformers>=4.30",
    "torch>=2.0",
    "nltk>=3.8",
    "geopy>=2.3",
    "requests>=2.28",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
geonames = [
    "pandas>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
all = [
    "geordie[geonames,dev]",
]

[project.urls]
Homepage = "https://github.com/sirisacademic/geordie"
Repository = "https://github.com/sirisacademic/geordie"
Issues = "https://github.com/sirisacademic/geordie/issues"

[project.scripts]
geordie = "geordie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["geordie"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires network"]
